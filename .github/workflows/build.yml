name: APK bauen

on:
  push:
    branches: [main]
    # Nur bauen, wenn sich die Android-App geaendert hat.
    paths-ignore:
      - "uhr/**"
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: APK bauen
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: APK umbenennen
        run: cp app/build/outputs/apk/debug/app-debug.apk ZaehlerSync.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ZaehlerSync
          path: ZaehlerSync.apk

      - name: Als Release bereitstellen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Zähler Sync, Build ${{ github.run_number }}
          files: ZaehlerSync.apk
