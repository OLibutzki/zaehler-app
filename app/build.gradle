plugins {
    id "com.android.application"
}

android {
    namespace "app.zaehler.sync"
    compileSdk 34

    defaultConfig {
        applicationId "app.zaehler.sync"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    // Fester Schluessel im Repository, damit jede gebaute APK dieselbe Signatur hat
    // und sich als Update ueber die vorige installieren laesst.
    signingConfigs {
        debug {
            storeFile file("../keystore/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
